<!-- Soy un svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1155 600" onclick="alert('No quiero decir nada')">
  <style>
.grid {
    fill: none;
    stroke: lightgray;
}
.axis {
    stroke: black;
}
.label {
    font-size: 10px;
    text-anchor: middle;
    dominant-baseline: middle;
}
.tick {
    font-size: 10px;
    text-anchor: end;
    dominant-baseline: middle;
}
.area {
    fill-opacity: .2;
    stroke-width: 1;
    transition: all ease .4s;
.area:hover {
    fill-opacity: .8;
    transition: all ease .4s;
}
}
.scale {
    fill: none;
    stroke: currentColor;
}
.scale-text {
    font-family: sans-serif;
    font-size: 10px;
    text-anchor: end;
    dominant-baseline: central;
}
.radar polygon {
    fill: var(--c);
    fill-opacity: 0.5;
    stroke: var(--c);
}
.radar circle {
    fill: var(--c);
    r: 2;
}
.swatch {
    width: 15px;
    height: 15px;
    fill: var(--c);
}
.legend text {
    font-size: 10px;
}
.legend .title {
    font-size: 12px;
    font-weight: bold;
}
    .s0 { --c: #9e0142; }
    .s1 { --c: #fdbe70; }
    .s2 { --c: #bee5a0; }
    .s3 { --c: #5e4fa2; }
  </style>
